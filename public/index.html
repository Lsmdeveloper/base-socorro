<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Base Socorro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f6f4; --surface:#ffffff; --fg:#14231c; --muted:#5b6b63; --line:#d6dfda;
  --accent:#0f6b4a; --accent-fg:#ffffff; --ok:#1d7a4e; --warn:#a36a00; --idle:#6b6f8a; --bad:#b3261e;
  --display:"Archivo",system-ui,sans-serif; --body:"Source Sans 3",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1714; --surface:#17221d; --fg:#e4ede8; --muted:#94a69c; --line:#2a3a33;
  --accent:#3fbf8a; --accent-fg:#06140e; --ok:#4fcf8f; --warn:#e2a73a; --idle:#a3a8c8; --bad:#f2827a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 32px;display:grid;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.2rem;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:1rem;margin:0}
.links{display:flex;gap:14px;align-items:center}
.lnk{text-decoration:none;background:none;border:none;padding:0;color:var(--accent);font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.lnk.sec{color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.big{font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
.big small{font-size:.9rem;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;color:var(--muted)}
.legend b{font-family:var(--mono);color:var(--fg);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.full{grid-column:1/-1}
label{display:grid;gap:3px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border-radius:7px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.primary:disabled{opacity:.6}
.danger{color:var(--bad)}
.glbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.grp{display:grid;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:1 1 auto;padding:8px 12px;border-radius:999px;background:var(--bg)}
.chips button[aria-checked="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.fchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;gap:6px}
.fchips button{flex:0 0 auto;padding:6px 12px;font-size:.85rem}
.radios{display:flex;flex-wrap:wrap;gap:6px 18px}
.radios label{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:.9rem;font-weight:400;color:var(--fg)}
.radios input{width:16px;height:16px;margin:0;padding:0;accent-color:var(--accent)}
.zap-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.zap{margin-bottom:10px}
.marca-lid{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.95rem;font-weight:600;color:var(--fg)}
.marca-lid input{width:18px;height:18px;margin:0;padding:0;accent-color:var(--accent)}
.lid-tag{display:inline-block;margin-left:6px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;vertical-align:2px}
.tzs{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.zap-fila{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.zap-fila span{flex:1;min-width:0}
.msg{font-size:.9rem;color:var(--muted);min-height:1.2em;margin:0}
.msg.err{color:var(--bad)}
.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.row .nome{font-weight:600}
.row .info{font-size:.85rem;color:var(--muted);grid-column:1/2;overflow-wrap:anywhere}
.pill{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;align-self:start;white-space:nowrap}
.p-certo{color:var(--ok)}.p-provavel{color:var(--warn)}.p-indeciso{color:var(--idle)}
.acts{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.acts button{padding:5px 10px;font-size:.85rem}
.empty{border:1px dashed var(--line);border-radius:8px;padding:20px;color:var(--muted);text-align:center}
.login{max-width:340px;margin:12vh auto 0;display:grid;gap:10px}
.login h1{font-size:1.5rem}
@media (max-width:520px){form{grid-template-columns:1fr}}
.adm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.adm-row:last-child{border-bottom:none}
.mono{font-family:var(--mono);font-size:.95rem;letter-spacing:.04em}
.muted{color:var(--muted);font-size:.85rem}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline input{flex:1 1 180px;width:auto}
textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;resize:vertical}
.off{opacity:.55}
</style>
</head>
<body>

<!-- Entrada -->
<div class="wrap" id="tela-login" hidden>
  <form class="login" id="f-login" style="grid-template-columns:1fr">
    <h1>Base Socorro</h1>
    <label for="matricula">Matrícula<input id="matricula" autocomplete="off" autocapitalize="characters" maxlength="20" required></label>
    <label for="nome-login">Nome completo <span class="muted">(só no primeiro acesso)</span><input id="nome-login" autocomplete="name" maxlength="80"></label>
    <button class="primary" type="submit" id="btn-entrar">Entrar</button>
    <p class="msg" id="msg-login" role="status"></p>
  </form>
</div>

<!-- Aplicativo -->
<div class="wrap" id="tela-app" hidden>
  <header class="top">
    <h1>Base Socorro</h1>
    <nav class="links">
      <a class="lnk" href="/lista" data-nav="lista" id="lnk-lista">Ver lista (<span id="n-total">0</span>) →</a>
      <a class="lnk" href="/" data-nav="cadastro" id="lnk-cad" hidden>← Cadastrar</a>
      <a class="lnk sec" href="/admin" data-nav="admin" id="lnk-admin" hidden>Admin</a>
      <button type="button" class="lnk sec" id="lnk-sair">Sair</button>
    </nav>
  </header>

  <div id="v-cadastro" style="display:grid;gap:12px">
    <section class="card" aria-label="Meta" id="meta-card">
      <div class="big" id="total">0 <small>/ 1.500</small></div>
      <div class="bar" id="bar" aria-hidden="true"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section>
      <div class="zap-top"><h2 id="form-title">Novo eleitor</h2><button type="button" class="lnk" id="zap-abrir">Colar do WhatsApp</button></div>
      <div class="card zap" id="zap" hidden>
        <label for="zap-txt">Cole a conversa ou os contatos<textarea id="zap-txt" rows="4" placeholder="George Santos&#10;79977228881&#10;Título 0123 4567 2121 Zona 34 Seção 120"></textarea></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="primary" id="zap-ok">Preencher</button><button type="button" id="zap-fechar">Fechar</button></div>
      </div>
      <div class="zap-fila" id="zap-fila" hidden><span id="zap-pos"></span><button type="button" class="lnk sec" id="zap-pular">Pular</button><button type="button" class="lnk sec" id="zap-parar">Parar</button></div>
      <form id="f">
        <label for="nome">Nome<input id="nome" required maxlength="120" autocomplete="off"></label>
        <label for="telefone">Telefone / WhatsApp<input id="telefone" type="tel" inputmode="numeric" maxlength="15" placeholder="(79) 99999-9999" autocomplete="off"></label>
        <label for="bairro">Bairro<select id="bairro" required><option value="">Selecione o bairro</option></select></label>
        <label for="lideranca">Liderança responsável<input id="lideranca" list="lideres" maxlength="80" autocomplete="off"></label>
        <label class="full marca-lid" for="eh_lideranca"><input type="checkbox" id="eh_lideranca"> Este eleitor é uma liderança</label>
        <div class="full grp"><span class="glbl">Compromisso</span><input type="hidden" id="nivel" value="provavel">
          <div class="chips" data-for="nivel" role="radiogroup" aria-label="Compromisso"><button type="button" data-v="certo">Voto certo</button><button type="button" data-v="provavel">Provável</button><button type="button" data-v="indeciso">Indeciso</button></div></div>
        <div class="full radios" role="radiogroup" aria-label="Título de eleitor">
          <label for="tit-vota"><input type="radio" name="titulo" id="tit-vota" value="vota" checked> Já vota em Socorro</label>
          <label for="tit-transf"><input type="radio" name="titulo" id="tit-transf" value="transferiu"> Transferiu título</label></div>
        <div class="full tzs">
          <label for="num_titulo">Nº do título<input id="num_titulo" inputmode="numeric" maxlength="14" placeholder="0000 0000 0000" autocomplete="off"></label>
          <label for="zona">Zona<input id="zona" inputmode="numeric" maxlength="4" autocomplete="off"></label>
          <label for="sec_eleitoral">Seção<input id="sec_eleitoral" inputmode="numeric" maxlength="4" autocomplete="off"></label>
        </div>
        <div class="full" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="primary" type="submit" id="save">Salvar eleitor</button>
          <button type="button" id="cancel" hidden>Cancelar edição</button>
        </div>
        <p class="msg full" id="msg" role="status"></p>
      </form>
      <datalist id="lideres"></datalist>
    </section>
  </div>

  <section id="v-lista" hidden style="display:grid;gap:8px">
    <input id="q" type="search" placeholder="Buscar nome ou liderança" autocomplete="off">
    <input type="hidden" id="fn" value="">
    <div class="chips fchips" data-for="fn" aria-label="Filtrar compromisso"><button type="button" data-v="">Todos</button><button type="button" data-v="certo">Certos</button><button type="button" data-v="lider">Lideranças</button><button type="button" data-v="provavel">Prováveis</button><button type="button" data-v="indeciso">Indecisos</button></div>
    <input type="hidden" id="fb" value="">
    <div class="chips fchips" data-for="fb" id="fb-chips" aria-label="Filtrar bairro"></div>
    <p class="msg" id="msg-lista" role="status"></p>
    <div class="list" id="list"></div>
  </section>

  <div id="v-admin" hidden style="display:grid;gap:12px">
    <section class="card">
      <h2>Coordenadores</h2>
      <form class="inline" id="f-coord" style="display:flex">
        <input id="novo-coord" placeholder="Nome do coordenador" maxlength="80" autocomplete="off" aria-label="Nome do coordenador">
        <button class="primary" type="submit">Gerar matrícula</button>
      </form>
      <p class="msg" id="msg-coord" role="status"></p>
      <div id="coords"></div>
    </section>
    <section class="card">
      <h2>Bairros</h2>
      <label for="bairros-txt">Um bairro por linha<textarea id="bairros-txt" rows="9"></textarea></label>
      <div><button class="primary" type="button" id="salvar-bairros">Salvar bairros</button></div>
      <p class="msg" id="msg-bairros" role="status"></p>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const LBL = {certo:"Voto certo", provavel:"Provável", indeciso:"Indeciso"};
const COL = {certo:"var(--ok)", provavel:"var(--warn)", indeciso:"var(--idle)"};
let estado = {rows:[], bairros:[], meta:1500, admin:false, nome:""};
let editando = null, confirmarExcluir = null, view = "cadastro";

function esc(s){ const d=document.createElement("div"); d.textContent = s==null ? "" : String(s); return d.innerHTML; }
function fmt(n){ return Number(n).toLocaleString("pt-BR"); }
function aviso(el, txt, erro){ $(el).textContent = txt || ""; $(el).classList.toggle("err", !!erro); }

/* Chamada à API: devolve os dados ou lança o erro com mensagem */
async function api(metodo, url, corpo){
  const op = { method: metodo, credentials: "same-origin", headers: {} };
  if (metodo !== "GET"){ op.headers["Content-Type"] = "application/json"; op.body = JSON.stringify(corpo || {}); }
  let r;
  try { r = await fetch(url, op); } catch (e) { throw new Error("Sem conexão. Verifique a internet e tente de novo."); }
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && d.erro === "SESSAO"){ mostrarLogin($("tela-app").hidden ? "" : "Sua sessão terminou. Entre de novo com a matrícula."); throw new Error(""); }
  if (!r.ok) throw new Error(d.erro || "Algo deu errado. Tente de novo.");
  return d;
}

/* ---------- Entrada ---------- */
function mostrarLogin(txt){
  $("tela-app").hidden = true; $("tela-login").hidden = false;
  aviso("msg-login", txt, !!txt); $("matricula").focus();
}
$("f-login").addEventListener("submit", async e => {
  e.preventDefault();
  $("btn-entrar").disabled = true; aviso("msg-login", "Entrando…");
  try { await api("POST", "/api/entrar", {matricula: $("matricula").value, nome: $("nome-login").value}); $("matricula").value = ""; $("nome-login").value = ""; await abrirApp(); }
  catch (err) { if (err.message) aviso("msg-login", err.message, true); }
  $("btn-entrar").disabled = false;
});
$("lnk-sair").addEventListener("click", async () => { try { await api("POST", "/api/sair"); } catch(e){} mostrarLogin(""); });

async function abrirApp(){
  $("list").innerHTML = '<div class="empty">Carregando…</div>';
  aplicar(await api("GET", "/api/dados"));
  $("tela-login").hidden = true; $("tela-app").hidden = false;
  $("lnk-admin").hidden = !estado.admin;
  mostrar(rotaAtual(), false);
}
function aplicar(r){ estado = r; desenharBairros(); render(); }

/* ---------- Navegação: / , /lista , /admin ---------- */
function rotaAtual(){ const p = location.pathname.replace(/\/+$/, ""); return p === "/lista" ? "lista" : p === "/admin" ? "admin" : "cadastro"; }
function mostrar(v, empurrar){
  if (v === "admin" && !estado.admin) v = "cadastro";
  view = v;
  $("v-cadastro").hidden = v !== "cadastro"; $("v-lista").hidden = v !== "lista"; $("v-admin").hidden = v !== "admin";
  $("lnk-lista").hidden = v === "lista"; $("lnk-cad").hidden = v === "cadastro";
  $("lnk-admin").hidden = !estado.admin || v === "admin";
  if (empurrar){ const url = v === "lista" ? "/lista" : v === "admin" ? "/admin" : "/"; if (location.pathname !== url) history.pushState({}, "", url); }
  if (v === "admin") carregarAdmin();
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-nav]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); mostrar(a.dataset.nav, true); }));
window.addEventListener("popstate", () => mostrar(rotaAtual(), false));

/* ---------- Seletores de toque ---------- */
function syncChips(){
  document.querySelectorAll(".chips").forEach(g => {
    const v = $(g.dataset.for).value;
    g.querySelectorAll("button").forEach(b => { b.setAttribute("role","radio"); b.setAttribute("aria-checked", b.dataset.v === v ? "true" : "false"); });
  });
}
document.querySelectorAll(".chips").forEach(g => g.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $(g.dataset.for).value = b.dataset.v; syncChips(); if (g.classList.contains("fchips")) render();
}));
function tituloAtual(){ const r = document.querySelector('input[name="titulo"]:checked'); return r ? r.value : "vota"; }
function setTitulo(v){ document.querySelectorAll('input[name="titulo"]').forEach(x => x.checked = x.value === (v || "vota")); }

function desenharBairros(){
  const sel = $("bairro"), cur = sel.value;
  sel.innerHTML = '<option value="">Selecione o bairro</option>' + estado.bairros.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join("");
  sel.value = estado.bairros.indexOf(cur) >= 0 ? cur : "";
  if (estado.bairros.indexOf($("fb").value) < 0) $("fb").value = "";
}

/* ---------- Desenho ---------- */
function render(){
  const rows = estado.rows, meta = estado.meta || 1500;
  const c = {certo:0, provavel:0, indeciso:0}; rows.forEach(r => c[r.nivel] = (c[r.nivel]||0) + 1);
  $("n-total").textContent = fmt(rows.length);
  $("total").innerHTML = fmt(c.certo) + ' <small>/ ' + fmt(meta) + '</small>';
  $("bar").innerHTML = ["certo","provavel","indeciso"].map(k => `<span style="width:${Math.min(100, c[k]/meta*100)}%;background:${COL[k]}"></span>`).join("");
  $("legend").innerHTML = [["certo","certos"],["provavel","prováveis"],["indeciso","indecisos"]].map(([k,t]) => `<span><i class="dot" style="background:${COL[k]}"></i><b>${fmt(c[k])}</b> ${t}</span>`).join("");

  const L = {}; rows.forEach(r => { if (r.lideranca) L[r.lideranca] = 1; if (r.eh_lideranca && r.nome) L[r.nome] = 1; });
  $("lideres").innerHTML = Object.keys(L).sort().map(l => `<option value="${esc(l)}">`).join("");

  const B = {}; rows.forEach(r => { if (r.bairro) B[r.bairro] = (B[r.bairro]||0) + 1; });
  $("fb-chips").innerHTML = '<button type="button" data-v="">Todos os bairros</button>' + estado.bairros.map(b => `<button type="button" data-v="${esc(b)}">${esc(b)}${B[b] ? " <b>"+B[b]+"</b>" : ""}</button>`).join("");
  syncChips();

  const q = $("q").value.trim().toLowerCase(), fn = $("fn").value, fb = $("fb").value;
  const vis = rows.filter(r => (!fn || (fn === "lider" ? r.eh_lideranca : r.nivel === fn)) && (!fb || r.bairro === fb) &&
    (!q || [r.nome, r.lideranca, r.coordenador].join(" ").toLowerCase().indexOf(q) >= 0));
  if (!rows.length){ $("list").innerHTML = '<div class="empty">Nenhum eleitor ainda. Cadastre o primeiro em “Cadastrar”.</div>'; return; }
  if (!vis.length){ $("list").innerHTML = '<div class="empty">Nada encontrado com esse filtro.</div>'; return; }
  $("list").innerHTML = vis.map(r => `<div class="row"><span class="nome">${esc(r.nome)}${r.eh_lideranca ? '<span class="lid-tag">Liderança</span>' : ""}</span><span class="pill p-${esc(r.nivel)}">${LBL[r.nivel]||""}</span>
    <span class="info">${[r.bairro, r.telefone, r.lideranca && ("Liderança: " + r.lideranca), (r.zona || r.sec_eleitoral) && ("Zona " + (r.zona || "?") + " · Seção " + (r.sec_eleitoral || "?")),  r.titulo === "transferiu" && "Transferiu título", estado.admin && r.coordenador && ("Por: " + r.coordenador)].filter(Boolean).map(esc).join(" · ")}</span>
    <div class="acts"><button type="button" data-ed="${esc(r.id)}">Editar</button>${confirmarExcluir === r.id
      ? `<button type="button" class="danger" data-delok="${esc(r.id)}">Confirmar exclusão</button><button type="button" data-delno="1">Não</button>`
      : `<button type="button" class="danger" data-del="${esc(r.id)}">Excluir</button>`}</div></div>`).join("");
}
$("q").addEventListener("input", render);

/* ---------- Lista: editar e excluir ---------- */
$("list").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.ed){
    const r = estado.rows.find(x => x.id === b.dataset.ed); if (!r) return;
    editando = r.id;
    $("nome").value = r.nome || ""; $("telefone").value = mascaraTel(r.telefone); $("bairro").value = r.bairro || "";
    $("lideranca").value = r.lideranca || ""; $("eh_lideranca").checked = !!r.eh_lideranca; $("num_titulo").value = mascaraTitulo(r.num_titulo); $("zona").value = r.zona || ""; $("sec_eleitoral").value = r.sec_eleitoral || "";
    $("nivel").value = r.nivel || "provavel"; setTitulo(r.titulo); syncChips();
    $("form-title").textContent = "Editar eleitor"; $("save").textContent = "Salvar alterações"; $("cancel").hidden = false;
    mostrar("cadastro", true); $("nome").focus();
  }
  if (b.dataset.del){ confirmarExcluir = b.dataset.del; render(); }
  if (b.dataset.delno){ confirmarExcluir = null; render(); }
  if (b.dataset.delok){
    b.disabled = true; aviso("msg-lista", "Excluindo…");
    try { aplicar(await api("DELETE", "/api/eleitores/" + encodeURIComponent(b.dataset.delok))); aviso("msg-lista", "Eleitor excluído."); }
    catch (err) { if (err.message) aviso("msg-lista", err.message, true); }
    confirmarExcluir = null; render();
  }
});

/* ---------- Máscara do telefone: (79) 99999-9999 ---------- */
function mascaraTel(v){
  let d = String(v || "").replace(/\D/g, "");
  if (d.length > 11 && d.startsWith("55")) d = d.slice(2);
  d = d.slice(0, 11);
  if (!d) return "";
  if (d.length <= 2) return "(" + d;
  const ddd = d.slice(0, 2), n = d.slice(2);
  if (n.length <= 4) return `(${ddd}) ${n}`;
  if (d.length <= 10) return `(${ddd}) ${n.slice(0, 4)}-${n.slice(4)}`;
  return `(${ddd}) ${n.slice(0, 5)}-${n.slice(5)}`;
}
$("telefone").addEventListener("input", e => {
  const el = e.target, antes = el.value.slice(0, el.selectionStart).replace(/\D/g, "").length;
  el.value = mascaraTel(el.value);
  let pos = 0, cont = 0;
  while (pos < el.value.length && cont < antes){ if (/\d/.test(el.value[pos])) cont++; pos++; }
  try { el.setSelectionRange(pos, pos); } catch (err) {}
});

/* ---------- Título, zona e seção ---------- */
function mascaraTitulo(v){ const d = String(v || "").replace(/\D/g, "").slice(0, 12); return d.replace(/(\d{4})(?=\d)/g, "$1 "); }
// Confere os dígitos verificadores do título de eleitor
function tituloValido(t){
  const d = String(t || "").replace(/\D/g, ""); if (d.length !== 12) return false;
  const n = d.split("").map(Number), uf = d.slice(8, 10);
  let s1 = 0; for (let i = 0; i < 8; i++) s1 += n[i] * (i + 2);
  let dv1 = s1 % 11; if (dv1 === 10) dv1 = 0; if ((uf === "01" || uf === "02") && dv1 === 0 && s1 % 11 === 0) dv1 = 1;
  let dv2 = (n[8] * 7 + n[9] * 8 + dv1 * 9) % 11; if (dv2 === 10) dv2 = 0; if ((uf === "01" || uf === "02") && dv2 === 0) dv2 = 1;
  return dv1 === n[10] && dv2 === n[11];
}
$("num_titulo").addEventListener("input", e => { e.target.value = mascaraTitulo(e.target.value); });
["zona", "sec_eleitoral"].forEach(id => $(id).addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); }));

/* ---------- Colar do WhatsApp ---------- */
// Lê nome, telefone, título, zona e seção de um texto copiado do WhatsApp (conversa, contato ou lista)
function lerWhats(texto){
  const out = [], vistos = {};
  let pendente = "", atual = null, extras = {};
  const LETRA = /[A-Za-zÀ-ÿ]{2}/;
  const novo = (nome, tel) => {
    const c = { nome: nome.trim().slice(0, 120), telefone: tel ? mascaraTel(tel) : "", num_titulo: "", zona: "", sec_eleitoral: "" };
    Object.assign(c, extras); extras = {}; out.push(c); atual = c; pendente = ""; return c;
  };
  const extra = (campo, valor) => {
    if (atual && !atual[campo]) atual[campo] = valor;
    else extras[campo] = valor;
  };
  String(texto || "").split(/\r?\n/).forEach(bruta => {
    let l = bruta.replace(/[‎‏‪-‮]/g, "").trim();
    const pref = l.match(/^\[?\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\]?\s*-?\s*/);
    if (pref){ l = l.slice(pref[0].length); l = l.replace(/^[^:]{1,40}:\s*/, ""); }
    l = l.replace(/[*_~]/g, "");
    // Campos com rótulo: título, zona, seção
    l = l.replace(/t[íi]t(ulo)?\.?(\s+de\s+eleitor)?\s*(n[º°o.]*)?\s*[:\-]?\s*((?:\d[\s.]?){12})/i, (_, a, b, c, num) => { extra("num_titulo", num.replace(/\D/g, "")); return " "; });
    l = l.replace(/\bzona\s*(eleitoral)?\s*[:\-]?\s*(\d{1,4})/i, (_, a, z) => { extra("zona", String(+z)); return " "; });
    l = l.replace(/\bse[çc][ãa]o\s*(eleitoral)?\s*[:\-]?\s*(\d{1,4})/i, (_, a, z) => { extra("sec_eleitoral", String(+z)); return " "; });
    l = l.replace(/^(nome|contato|tel(efone)?|cel(ular)?|whats(app)?|fone|zap)\s*[:\-]\s*/i, "").replace(/\s+/g, " ").trim();
    if (!l || !/\w/.test(l)) return;
    const m = l.match(/\+?\(?\d[\d\s().\-]{8,}\d/);
    const dig = m ? m[0].replace(/\D/g, "") : "";
    const resto = m ? (l.slice(0, m.index) + " " + l.slice(m.index + m[0].length)).replace(/[:\-–|,;]+/g, " ").replace(/\s+/g, " ").trim() : "";
    if (m && dig.length === 12 && !/^\+|^55/.test(m[0].trim()) && tituloValido(dig)){
      // Número de 12 dígitos sem rótulo que é um título válido
      if (LETRA.test(resto)){ if (pendente) novo(pendente, ""); novo(resto, ""); }
      extra("num_titulo", dig);
    } else if (m && dig.length >= 10 && dig.length <= 13){
      if (vistos[dig]) { pendente = ""; return; }
      vistos[dig] = 1;
      const nome = LETRA.test(resto) ? resto : pendente;
      if (atual && !atual.telefone && (!nome || nome === atual.nome)) { atual.telefone = mascaraTel(dig); pendente = ""; }
      else novo(nome, dig);
    } else if (LETRA.test(l) && l.length <= 60 && !/[,?!]|https?:|www\./i.test(l)){
      if (pendente) novo(pendente, "");
      pendente = l; atual = null;
    }
  });
  if (pendente) novo(pendente, "");
  const util = out.filter(c => c.telefone || c.num_titulo);
  return util.length ? util : out.filter(c => c.nome);
}
let filaZap = [], posZap = 0;
function preencherZap(c){
  $("nome").value = c.nome || ""; $("telefone").value = c.telefone || "";
  $("num_titulo").value = mascaraTitulo(c.num_titulo); $("zona").value = c.zona || ""; $("sec_eleitoral").value = c.sec_eleitoral || "";
  $("nome").focus();
}
function mostrarFila(){
  const ativa = filaZap.length > 1 && posZap < filaZap.length;
  $("zap-fila").hidden = !ativa;
  if (ativa) $("zap-pos").textContent = `Contato ${posZap + 1} de ${filaZap.length} do WhatsApp`;
}
function proximoZap(){
  posZap++;
  if (posZap < filaZap.length){ preencherZap(filaZap[posZap]); mostrarFila(); }
  else { const n = filaZap.length; filaZap = []; mostrarFila(); if (n > 1) aviso("msg", "Todos os contatos colados foram vistos."); }
}
$("zap-abrir").addEventListener("click", () => { $("zap").hidden = false; $("zap-txt").focus(); });
$("zap-fechar").addEventListener("click", () => { $("zap").hidden = true; });
$("zap-ok").addEventListener("click", () => {
  const lista = lerWhats($("zap-txt").value);
  if (!lista.length) return aviso("msg", "Não encontrei nome nem telefone no texto colado.", true);
  if (editando) limparForm(true);
  filaZap = lista; posZap = 0; preencherZap(lista[0]); mostrarFila();
  $("zap-txt").value = ""; $("zap").hidden = true;
  aviso("msg", lista.length > 1 ? `${lista.length} contatos encontrados. Confira, escolha o bairro e salve cada um.` : "Preenchido. Confira, escolha o bairro e salve.");
});
$("zap-pular").addEventListener("click", proximoZap);
$("zap-parar").addEventListener("click", () => { filaZap = []; mostrarFila(); limparForm(true); aviso("msg", ""); });

/* ---------- Formulário ---------- */
function limparForm(manter){
  const b = $("bairro").value, l = $("lideranca").value;
  editando = null; $("f").reset(); $("nivel").value = "provavel"; setTitulo("vota");
  if (manter){ $("bairro").value = b; $("lideranca").value = l; }
  $("form-title").textContent = "Novo eleitor"; $("save").textContent = "Salvar eleitor"; $("cancel").hidden = true; syncChips();
}
$("cancel").addEventListener("click", () => { filaZap = []; mostrarFila(); limparForm(false); });

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const d = { nome: $("nome").value.trim(), telefone: $("telefone").value.trim(), bairro: $("bairro").value,
    lideranca: $("lideranca").value.trim(), eh_lideranca: $("eh_lideranca").checked, nivel: $("nivel").value, titulo: tituloAtual(), num_titulo: $("num_titulo").value.replace(/\D/g, ""), zona: $("zona").value.replace(/\D/g, ""), sec_eleitoral: $("sec_eleitoral").value.replace(/\D/g, "") };
  if (!d.nome) return aviso("msg", "Informe o nome.", true);
  if (!d.bairro) return aviso("msg", "Escolha o bairro.", true);
  const dig = d.telefone.replace(/\D/g, "").length;
  if (dig && dig < 10) return aviso("msg", "Telefone incompleto. Use DDD + número, ex.: (79) 99999-9999.", true);
  if (d.num_titulo && d.num_titulo.length !== 12) return aviso("msg", "O título tem 12 números. Confira o número digitado.", true);
  $("save").disabled = true; aviso("msg", "Salvando…");
  const eraEdicao = !!editando;
  try {
    aplicar(await api(eraEdicao ? "PUT" : "POST", eraEdicao ? "/api/eleitores/" + encodeURIComponent(editando) : "/api/eleitores", d));
    aviso("msg", eraEdicao ? "Alterações salvas." : d.nome + " cadastrado(a).");
    limparForm(!eraEdicao); $("nome").focus();
    if (!eraEdicao && filaZap.length > 1) proximoZap();
  } catch (err) { if (err.message) aviso("msg", err.message, true); }
  $("save").disabled = false;
});

/* ---------- Administração ---------- */
function desenharCoords(lista){
  $("coords").innerHTML = lista.map(c => `<div class="adm-row${c.ativo ? "" : " off"}">
    <div><div><b>${esc(c.nome)}</b> <span class="muted">${c.perfil === "admin" ? "· administrador" : "· " + c.cadastros + " cadastros"}</span></div>
    <div class="mono">${esc(c.matricula)}${c.ip_cadastro ? ' <span class="muted">· IP ' + esc(c.ip_cadastro) + '</span>' : ""}</div></div>
    ${c.perfil === "admin" ? "" : `<button type="button" data-ativo="${c.ativo ? "0" : "1"}" data-m="${esc(c.matricula)}">${c.ativo ? "Desativar" : "Reativar"}</button>`}
  </div>`).join("");
}
async function carregarAdmin(){
  $("bairros-txt").value = estado.bairros.join("\n");
  try { desenharCoords(await api("GET", "/api/coordenadores")); } catch (err) { if (err.message) aviso("msg-coord", err.message, true); }
}
$("f-coord").addEventListener("submit", async e => {
  e.preventDefault();
  const nome = $("novo-coord").value.trim(); if (!nome) return aviso("msg-coord", "Informe o nome.", true);
  try { const r = await api("POST", "/api/coordenadores", {nome}); desenharCoords(r.lista); $("novo-coord").value = "";
    aviso("msg-coord", "Matrícula de " + nome + ": " + r.matricula); }
  catch (err) { if (err.message) aviso("msg-coord", err.message, true); }
});
$("coords").addEventListener("click", async e => {
  const b = e.target.closest("button[data-m]"); if (!b) return;
  b.disabled = true;
  try { desenharCoords(await api("PATCH", "/api/coordenadores/" + encodeURIComponent(b.dataset.m), {ativo: b.dataset.ativo === "1"})); aviso("msg-coord", ""); }
  catch (err) { if (err.message) aviso("msg-coord", err.message, true); b.disabled = false; }
});
$("salvar-bairros").addEventListener("click", async () => {
  const lista = $("bairros-txt").value.split("\n").map(x => x.trim()).filter(Boolean);
  try { const r = await api("PUT", "/api/bairros", {lista}); estado.bairros = r.bairros; desenharBairros(); render(); aviso("msg-bairros", "Bairros salvos."); }
  catch (err) { if (err.message) aviso("msg-bairros", err.message, true); }
});

/* ---------- Início ---------- */
syncChips();
abrirApp().catch(err => { if (err.message) mostrarLogin(""); });
